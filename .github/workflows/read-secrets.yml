name: Read Secrets

on:
  workflow_call:
    secrets:
      MY_CREDENTIAL:
        description: "The credential to read."
        required: true
      MY_VAULT_ROLE_ID:
        description: "The Vault role ID to read."
        required: false
      MY_VAULT_SECRET_ID:
        description: "The Vault secret ID to read."
        required: false

jobs:
  read-secrets:
    runs-on: ubuntu-latest
    environment: debug
    steps:
      - name: Read secret
        env:
          MY_CREDENTIAL: ${{ secrets.MY_CREDENTIAL }}
          MY_VAULT_ROLE_ID: ${{ secrets.MY_VAULT_ROLE_ID }}
          MY_VAULT_SECRET_ID: ${{ secrets.MY_VAULT_SECRET_ID }}
        run: |
          for var in MY_CREDENTIAL MY_VAULT_ROLE_ID MY_VAULT_SECRET_ID; do
            [ -n "${!var}" ] && echo "$var is set: yes" || echo "$var is set: no"
          done
