name: Read Environment Secrets

on:
  workflow_dispatch:

jobs:
  read-secrets:
    runs-on: ubuntu-latest
    environment: debug
    steps:
      - name: Read secrets
        env:
          MY_VAULT_ROLE_ID: ${{ secrets.MY_VAULT_ROLE_ID }}
          MY_VAULT_SECRET_ID: ${{ secrets.MY_VAULT_SECRET_ID }}
        run: |
          echo "MY_VAULT_ROLE_ID is set: ${MY_VAULT_ROLE_ID:+yes}"
          echo "MY_VAULT_SECRET_ID is set: ${MY_VAULT_SECRET_ID:+yes}"
