name: Read Environment Secrets

on:
  workflow_dispatch:

jobs:
  read-secrets:
    runs-on: ubuntu-latest
    environment: debug
    steps:
      - name: Read secrets
        env:
          MY_VAULT_ROLE_ID: ${{ secrets.MY_VAULT_ROLE_ID }}
          MY_VAULT_SECRET_ID: ${{ secrets.MY_VAULT_SECRET_ID }}
        run: |
          for var in MY_VAULT_ROLE_ID MY_VAULT_SECRET_ID; do
            [ -n "${!var}" ] && echo "$var is set: yes" || echo "$var is set: no"
          done
